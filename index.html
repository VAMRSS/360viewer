<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>360 Viewer</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.css">

<script src="https://cdn.jsdelivr.net/npm/pannellum/build/pannellum.js"></script>

<style>
body{
margin:0;
background:#111;
color:white;
font-family:sans-serif;
}

.toolbar{
padding:10px;
background:#222;
}

  .title{
font-size:14px;
margin-bottom:8px;
font-weight:bold;
}

.version{
opacity:0.6;
font-size:12px;
margin-left:6px;
font-weight:normal;
}
  
#panorama{
width:100vw;
height:calc(100vh - 60px);
}

input{
width:100%;
font-size:16px;
}
</style>
</head>

<body>

<div class="toolbar">
<div class="title">
360 Viewer
<span class="version">v0.1.0</span>
</div>

<input type="file" accept="image/*" id="imageInput">
</div>

<div id="panorama"></div>

<script>

let viewer = null;

document.getElementById("imageInput")
.addEventListener("change", function(e){

const file = e.target.files[0];

if(!file) return;

const imageUrl = URL.createObjectURL(file);

if(viewer){
viewer.destroy();
}

viewer = pannellum.viewer("panorama",{
type:"equirectangular",
panorama:imageUrl,
autoLoad:true,
haov:240,
vaov:120,
vOffset:0,
hfov:100,
minHfov:50,
maxHfov:120
});

});

</script>

</body>
</html>
